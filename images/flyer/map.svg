<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet">
  <rect width="400" height="240" fill="#FBF9F4"/>
  <!-- 道路 -->
  <path d="M 0 130 L 400 130" stroke="#C38D5E" stroke-width="6" opacity="0.3"/>
  <path d="M 0 130 L 400 130" stroke="#FBF9F4" stroke-width="1" stroke-dasharray="6 6"/>
  <path d="M 220 0 L 220 240" stroke="#C38D5E" stroke-width="4" opacity="0.25"/>
  <path d="M 220 0 L 220 240" stroke="#FBF9F4" stroke-width="0.8" stroke-dasharray="4 4"/>
  <path d="M 60 0 Q 70 90 140 130 Q 210 165 280 240" stroke="#C38D5E" stroke-width="3" opacity="0.2" fill="none"/>
  <!-- 周辺施設 -->
  <rect x="40" y="40" width="50" height="32" rx="2" fill="#85C1A3" opacity="0.55"/>
  <text x="65" y="60" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#3D3128">公園</text>
  <rect x="320" y="50" width="55" height="30" rx="2" fill="#E8A87C" opacity="0.55"/>
  <text x="347" y="69" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#3D3128">バス停</text>
  <rect x="290" y="170" width="60" height="36" rx="2" fill="#F4E4C1"/>
  <text x="320" y="192" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#3D3128">スーパー</text>
  <!-- 当施設のピン -->
  <circle cx="180" cy="100" r="14" fill="#C38D5E"/>
  <circle cx="180" cy="100" r="6" fill="#FBF9F4"/>
  <text x="180" y="86" text-anchor="middle" font-family="'Shippori Mincho', serif" font-size="10" font-weight="700" fill="#3D3128">ハーベスト</text>
  <!-- 凡例 -->
  <text x="200" y="225" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#3D3128" opacity="0.6" letter-spacing="2">簡易マップ（実際の地図に差し替え）</text>
</svg>
