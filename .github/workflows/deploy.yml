name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/*

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 非公開ファイル（手渡し限定チラシ等）をデプロイから除外
      # git 上には残すが GitHub Pages には公開しない
      - name: Remove private files before deploy
        run: |
          rm -f flyer.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
